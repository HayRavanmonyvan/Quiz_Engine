{% extends 'base.html' %}
{% block title %}Student Sign Up - Quiz Engine{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6 col-lg-5">
        <!-- Google Form Styled Registration Card -->
        <div class="gf-card gf-card-header-top p-4 mb-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center bg-purple-subtle rounded-circle mb-2" 
                     style="width: 54px; height: 54px; background-color: var(--gf-purple-light); color: var(--gf-purple);">
                    <i class="bi bi-person-plus-fill fs-3"></i>
                </div>
                <h3 class="fw-bold mb-1" style="color: var(--gf-purple);">Student Sign Up</h3>
                <p class="text-muted small">Create your student account to access and take assessments</p>
            </div>

            <form method="POST" action="{{ url_for('web.register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">
                        Username <span class="text-danger">*</span>
                    </label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" 
                           placeholder="e.g. student_sam" value="{{ username or '' }}" required autofocus>
                    <div class="form-text">Choose a unique username.</div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">
                        Email Address <span class="text-danger">*</span>
                    </label>
                    <input type="email" class="form-control form-control-lg" id="email" name="email" 
                           placeholder="sam@student.edu" value="{{ email or '' }}" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">
                        Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" 
                           placeholder="Create a password" required>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label fw-semibold">
                        Confirm Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" 
                           placeholder="Re-enter your password" required>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn gf-btn-purple py-2 fs-6 shadow-sm">
                        <i class="bi bi-person-check-fill me-1"></i> Register Student Account
                    </button>
                </div>
            </form>

            <div class="text-center pt-3 border-top">
                <span class="text-muted small">Already have an account?</span>
                <a href="{{ url_for('web.login') }}" class="fw-semibold text-decoration-none ms-1" style="color: var(--gf-purple);">
                    Sign In &rarr;
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
