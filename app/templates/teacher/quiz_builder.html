{% extends 'base.html' %}
{% block title %}{% if is_edit %}Edit Quiz{% else %}Create Quiz{% endif %} - Google Form Builder{% endblock %}

{% block content %}
<div class="gf-builder-container">
    <form id="quizBuilderForm" method="POST" action="{% if is_edit %}{{ url_for('web.edit_quiz', quiz_id=quiz.id) }}{% else %}{{ url_for('web.new_quiz') }}{% endif %}">
        <input type="hidden" name="quiz_data" id="quiz_data">

        <!-- Form Top Header Card -->
        <div class="gf-card gf-card-header-top p-4 mb-4">
            <input type="text" class="form-control gf-title-input mb-3" id="quizTitle" 
                   placeholder="Untitled Assessment" 
                   value="{% if quiz %}{{ quiz.title }}{% endif %}" required>
            
            <textarea class="form-control gf-desc-input mb-4" id="quizDescription" rows="2" 
                      placeholder="Form description / assessment instructions">{% if quiz %}{{ quiz.description or '' }}{% endif %}</textarea>

            <div class="row g-3 pt-3 border-top align-items-center">
                <div class="col-sm-4">
                    <label for="passPercentage" class="form-label small fw-semibold text-secondary mb-1">
                        <i class="bi bi-award me-1"></i> Passing Threshold (%)
                    </label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="passPercentage" min="1" max="100" 
                               value="{% if quiz %}{{ quiz.pass_percentage }}{% else %}50.0{% endif %}" required>
                        <span class="input-group-text">%</span>
                    </div>
                </div>
                <div class="col-sm-4">
                    <label for="timeLimitMinutes" class="form-label small fw-semibold text-secondary mb-1">
                        <i class="bi bi-stopwatch me-1"></i> Time Limit (min)
                    </label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="timeLimitMinutes" min="0" max="600" 
                               value="{% if quiz and quiz.time_limit_minutes is defined %}{{ quiz.time_limit_minutes }}{% else %}0{% endif %}" 
                               placeholder="0 = Unlimited">
                        <span class="input-group-text">min</span>
                    </div>
                </div>
                <div class="col-sm-4 text-sm-end">
                    <span class="badge bg-purple-subtle text-purple border p-2" style="color: var(--gf-purple); background-color: var(--gf-purple-light);">
                        <i class="bi bi-info-circle me-1"></i> Radio marks <strong>Correct Answer</strong>
                    </span>
                </div>
            </div>
        </div>

        <!-- Dynamic Questions Container -->
        <div id="questionsContainer">
            <!-- Questions dynamically generated by quiz_builder.js -->
        </div>

        <!-- Sticky Floating Action Bar -->
        <div class="gf-sticky-actions d-flex justify-content-between align-items-center mb-5">
            <button type="button" class="btn btn-outline-secondary rounded-pill px-3" id="addQuestionBtn">
                <i class="bi bi-plus-circle-fill text-purple me-1" style="color: var(--gf-purple);"></i> Add Question
            </button>

            <div class="d-flex gap-2">
                <a href="{{ url_for('web.teacher_dashboard') }}" class="btn btn-light rounded-pill px-3">Cancel</a>
                <button type="button" class="btn gf-btn-purple rounded-pill px-4" id="saveQuizBtn">
                    <i class="bi bi-cloud-arrow-up-fill me-1"></i> Save Quiz
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<!-- JSON Data Island for initial questions in edit mode -->
<script id="initialQuizData" type="application/json">
{% if quiz and quiz.questions %}
[
    {% for q in quiz.questions %}
    {
        "prompt": {{ q.prompt|tojson }},
        "points": {{ q.points }},
        "options": [
            {% for opt in q.options %}
            { "text": {{ opt.option_text|tojson }}, "is_correct": {% if opt.is_correct %}true{% else %}false{% endif %} }{% if not loop.last %},{% endif %}
            {% endfor %}
        ]
    }{% if not loop.last %},{% endif %}
    {% endfor %}
]
{% else %}
[]
{% endif %}
</script>
<!-- Static Quiz Builder Script -->
<script src="{{ url_for('static', filename='js/quiz_builder.js') }}"></script>
{% endblock %}
